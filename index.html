<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Il mio piano</title>
<style>
/* VOICE: calma, da app di sistema iPhone; numeri grandi, poche parole
   IDEA: la pagina Riepilogo dell'app Salute: schede con categoria colorata e un dato grande
   PICTURE: le schede Calorie e Proteine in cima, la cena di stasera con le dosi già adattate
   COLOUR and TYPE: grigio/nero di sistema, un colore per categoria; carattere di sistema SF
   LAYOUT: titolo grande, sezioni con schede arrotondate, barra a capsula fluttuante in basso */
:root{color-scheme:light dark;
  --bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--card2:light-dark(#f2f2f7,#2c2c2e);
  --ink:light-dark(#000,#fff);--muted:light-dark(#8a8a8e,#98989f);--line:light-dark(#e3e3e8,#38383a);
  --blue:light-dark(#007aff,#0a84ff);--orange:light-dark(#ff6a2c,#ff7a3d);--purple:light-dark(#a550d6,#bf5af2);
  --green:light-dark(#28b14c,#30d158);--yellow:light-dark(#e6a700,#ffd60a);--teal:light-dark(#1a9fb8,#40c8e0);
  --red:light-dark(#ff3b30,#ff453a);--pink:light-dark(#f2405f,#ff375f);--indigo:light-dark(#5856d6,#7d7aff);
  --glass:light-dark(rgba(250,250,252,.78),rgba(44,44,46,.72));
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.navbar{position:fixed;top:0;left:0;right:0;z-index:6;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;text-align:center;font-weight:600;font-size:17px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:.5px solid var(--line);opacity:0;pointer-events:none;transition:opacity .18s}
.navbar.on{opacity:1}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 4px 6px}
.big h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:.2px}
.big .sub{color:var(--muted);font-size:15px;margin-top:2px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(180deg,#a3a7c9,#6d7196);color:#fff;font-weight:600;font-size:16px;display:grid;place-items:center}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.sec h2{font-size:22px;margin:0;font-weight:700}
.sec .lnk{color:var(--blue);border:0;background:none;font-size:17px;padding:4px}
.card{background:var(--card);border-radius:22px;padding:16px 16px 18px;margin-bottom:12px;position:relative;border:0;display:block;width:100%;text-align:left}
button.card:active,.tap:active{opacity:.65}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:16px}
.ch .t{display:flex;align-items:center;gap:7px;min-width:0}
.ch .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .r{color:var(--muted);font-weight:400;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ic{width:20px;height:20px;flex:none}
.chev{width:9px;height:15px;flex:none;color:var(--muted)}
.val{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:22px}
.num{font-size:clamp(30px,9vw,36px);font-weight:700;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.num small{font-size:17px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:4px}
.desc{color:var(--muted);font-size:15px;margin-top:6px}
.c-orange{color:var(--orange)}.c-purple{color:var(--purple)}.c-green{color:var(--green)}.c-blue{color:var(--blue)}.c-yellow{color:var(--yellow)}.c-teal{color:var(--teal)}.c-red{color:var(--red)}.c-pink{color:var(--pink)}.c-indigo{color:var(--indigo)}
.meter{height:10px;border-radius:99px;background:var(--card2);display:flex;overflow:hidden;margin-top:14px;gap:2px}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.ring{width:64px;height:64px;flex:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid2 .card{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:0;background:var(--card2);padding:7px 12px;border-radius:99px;font-size:14px;min-height:34px}
.chip.on{background:var(--teal);color:#fff}
.chip.on.g{background:var(--green)}
.row{display:flex;align-items:center;gap:12px}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:var(--card2);position:relative;flex:none;transition:background .2s;margin:0;border:0}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--green)}.switch:checked:after{transform:translateX(20px)}
.list{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;background:none;width:100%;text-align:left;position:relative;min-height:52px}
.li+.li:before{content:"";position:absolute;top:0;left:56px;right:0;border-top:.5px solid var(--line)}
.list.plain .li+.li:before{left:16px}
.li .main{flex:1;min-width:0}
.li .tt{font-size:17px}
.li .st{font-size:14px;color:var(--muted);margin-top:1px}
.li .q{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:16px}
.badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.badge svg{width:18px;height:18px}
.b-pesce{background:var(--blue)}.b-carne-bianca{background:var(--orange)}.b-carne-rossa{background:var(--red)}.b-uova{background:var(--yellow)}.b-legumi{background:var(--green)}.b-latticini{background:var(--purple)}
.ing{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:.5px solid var(--line)}
.ing:first-of-type{border-top:0}
.ing .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ing.hl .q{color:var(--green)}
.ing.hl.down .q{color:var(--orange)}
.note{border-radius:14px;padding:11px 13px;font-size:15px;margin-top:12px;background:color-mix(in srgb,var(--green) 14%,transparent)}
.note.warn{background:color-mix(in srgb,var(--orange) 16%,transparent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:0;background:var(--card2);color:var(--blue);padding:11px 16px;border-radius:99px;font-size:16px;font-weight:600;min-height:44px}
.btn.pri{background:var(--blue);color:#fff}
.btn.ok{background:var(--green);color:#fff}
.btn.full{width:100%}
.btn.danger{color:var(--red)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px;gap:2px;margin-top:6px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:15px;min-height:36px}
.seg button.on{background:light-dark(#fff,#636366);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
label.f{display:block;font-size:13px;color:var(--muted);margin:16px 4px 6px;text-transform:none}
select,input[type=text],input[type=number],input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:0;background:var(--card2);font-size:16px;appearance:none;-webkit-appearance:none;min-height:44px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.search{position:relative;margin:8px 0 4px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px;background:light-dark(#e3e3e8,#1c1c1e);border-radius:99px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tile{border:0;border-radius:22px;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:#1b1b1d;font-size:19px;font-weight:600;line-height:1.15}
.tile svg{width:32px;height:32px}
.tile small{font-size:13px;font-weight:500;opacity:.7}
.tile.on{outline:3px solid var(--ink);outline-offset:2px}
.t-pesce{background:linear-gradient(135deg,#5ac8fa,#9fe0ff)}.t-carne-bianca{background:linear-gradient(135deg,#f07a3e,#f5a77a)}
.t-carne-rossa{background:linear-gradient(135deg,#ec5a6c,#f3909a)}.t-uova{background:linear-gradient(135deg,#f4c430,#f8dc7a)}
.t-legumi{background:linear-gradient(135deg,#5cc96a,#97dd9b)}.t-latticini{background:linear-gradient(135deg,#c86ce6,#e09cf2)}
.t-preferite{background:linear-gradient(135deg,#f25f84,#f79ab2)}.t-tutte{background:linear-gradient(135deg,#7f86f0,#aeb2f7)}
.daytag{width:42px;flex:none;text-align:center;font-size:12px;color:var(--muted);line-height:1.1}
.daytag b{display:block;font-size:20px;color:var(--ink);font-weight:600}
.daytag.today b{color:var(--red)}
.done .tt{text-decoration:line-through;color:var(--muted)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid light-dark(#c7c7cc,#545458);flex:none;display:grid;place-items:center}
.on>.check{background:var(--green);border-color:var(--green)}
.on>.check:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.on .tt{color:var(--muted);text-decoration:line-through}
.cat{font-size:13px;color:var(--muted);margin:22px 16px 6px;text-transform:uppercase;letter-spacing:.3px}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.src{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);margin-top:8px}
ol.steps{padding-left:22px;margin:8px 0 0}ol.steps li{margin:8px 0}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:7;display:flex;gap:2px;padding:5px;border-radius:99px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);box-shadow:0 8px 30px rgba(0,0,0,.18),inset 0 0 0 .5px light-dark(rgba(0,0,0,.08),rgba(255,255,255,.12));width:min(92vw,380px)}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:99px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:600;color:var(--ink);transition:background .2s}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--blue);background:light-dark(rgba(0,0,0,.06),rgba(255,255,255,.12))}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:light-dark(#f2f2f7,#1c1c1e);border-radius:14px 14px 0 0;z-index:11;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto}
.sheet.open{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:9px;background:light-dark(#c7c7cc,#545458);margin:2px auto 12px}
.sheet h2{margin:4px 4px 4px;font-size:24px}
.sheet .card,.sheet .list{background:light-dark(#fff,#2c2c2e)}
.sheet .chip,.sheet select,.sheet input{background:light-dark(#eeeef0,#3a3a3c)}
.sheet .seg{background:light-dark(#e3e3e8,#3a3a3c)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:light-dark(rgba(30,30,32,.92),rgba(235,235,240,.95));color:light-dark(#fff,#000);padding:10px 18px;border-radius:99px;font-size:15px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.muted{color:var(--muted)}.small{font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="navbar" id="navbar"></div>
<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="Sezioni">
  <button data-tab="oggi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-4.9-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 16.1 12 21 12 21z"/></svg>Oggi</button>
  <button data-tab="ricette"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.2"/><rect x="13" y="3" width="8" height="8" rx="2.2"/><rect x="3" y="13" width="8" height="8" rx="2.2"/><rect x="13" y="13" width="8" height="8" rx="2.2"/></svg>Ricette</button>
  <button data-tab="spesa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.4"/><circle cx="9.5" cy="19.5" r="1.4" fill="currentColor"/><circle cx="17" cy="19.5" r="1.4" fill="currentColor"/></svg>Spesa</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
{
"use strict";
/* ============ ICONE ============ */
const P={
 flame:'<path d="M12 2.5c.8 3.2 5.5 5.3 5.5 10.6A5.5 5.5 0 0 1 6.5 13c0-2.3 1.1-3.9 2.3-5 .1 2 1 3.2 2.2 3.4-.3-3.3.3-6.3 1-8.9z" fill="currentColor"/>',
 bolt:'<path d="M13.5 2 4.5 13.5h6.2L9.8 22l9.2-12h-6.3z" fill="currentColor"/>',
 cup:'<path d="M4 9h13v4.5a6.5 6.5 0 0 1-13 0z" fill="currentColor"/><path d="M17 10.5h1.5a2.5 2.5 0 0 1 0 5H16.5M8 2.5v3.5M12 2.5v3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 apple:'<path d="M12 7.6c-1.8-1.5-7-1.3-7 4.6 0 5 3.1 9.3 5.1 9.3 1 0 1.3-.5 1.9-.5s.9.5 1.9.5c2 0 5.1-4.3 5.1-9.3 0-5.9-5.2-6.1-7-4.6z" fill="currentColor"/><path d="M12 7.5c0-2.2.8-4.2 3.2-4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 fork:'<path d="M6 2.5v7a2.5 2.5 0 0 0 2.5 2.5V21.5M4 2.5v6M8.5 2.5v6M18 2.5c-2.3.8-3.5 4-3.5 8h3.5v11" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>',
 moon:'<path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z" fill="currentColor"/>',
 run:'<circle cx="14.5" cy="4" r="2" fill="currentColor"/><path d="M6 21l3.5-5.5 3 2V22M8 11l3-3.5 3.5 2 2.5 3.5h3M11 7.5 9.5 14l4 2.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>',
 fish:'<path d="M2.5 12c3.2-5.2 9.4-6.3 14.3-2.4L21 6.5v11l-4.2-3.1C11.9 18.3 5.7 17.2 2.5 12z" fill="currentColor"/>',
 drum:'<path d="M15.2 3a5.8 5.8 0 0 1 0 11.6c-1.4 0-2.6.7-3.6 1.7l-2.7 2.7a2.2 2.2 0 1 1-3.4-2.7 2.2 2.2 0 1 1 2.7-3.4l2.7-2.7c1-1 1.7-2.2 1.7-3.6A5.8 5.8 0 0 1 15.2 3z" fill="currentColor"/>',
 steak:'<path d="M3.5 13.5C3.5 8 8 3.5 13.5 3.5c4.2 0 7 2.8 7 6.3 0 6-6.4 10.7-11.7 10.7-3.3 0-5.3-3-5.3-7z" fill="currentColor"/><circle cx="13.5" cy="10" r="2.3" fill="#fff" opacity=".75"/>',
 egg:'<path d="M12 2.5c3.8 0 6.5 6.5 6.5 11a6.5 6.5 0 0 1-13 0c0-4.5 2.7-11 6.5-11z" fill="currentColor"/>',
 leaf:'<path d="M4.5 19.5C4.5 9.8 11 4.5 20 4.5c0 9-5.6 15-15.5 15z" fill="currentColor"/><path d="M4.5 19.5 13 11" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>',
 milk:'<path d="M8.5 2.5h7v3l2 3.5v12.5h-11V9l2-3.5z" fill="currentColor"/>',
 heart:'<path d="M12 21s-8-4.9-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 16.1 12 21 12 21z" fill="currentColor"/>',
 grid:'<rect x="3" y="3" width="8" height="8" rx="2.2" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="2.2" fill="currentColor"/><rect x="3" y="13" width="8" height="8" rx="2.2" fill="currentColor"/><rect x="13" y="13" width="8" height="8" rx="2.2" fill="currentColor"/>',
 cart:'<path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.5" fill="currentColor"/><circle cx="17" cy="19.5" r="1.5" fill="currentColor"/>',
 search:'<circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'
};
const ico=(k,cls='ic')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const CHEV='<svg class="chev" viewBox="0 0 9 15" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GROUPS={'pesce':['Pesce','fish'],'carne bianca':['Carne bianca','drum'],'carne rossa':['Carne rossa','steak'],'uova':['Uova','egg'],'legumi':['Legumi','leaf'],'latticini':['Latticini','milk']};
const gcls=g=>g.replace(' ','-');

/* ============ ALIMENTI ============ */
// per 100 g (u:'g'), per pezzo (u:'pz') o q.b.: [kcal, proteine, carboidrati, grassi]
const ING={
  pollo:{n:'Petto di pollo',u:'g',cat:'Carne e pesce',m:[110,23,0,1.5]},
  tacchino:{n:'Fesa di tacchino a fette',u:'g',cat:'Carne e pesce',m:[107,24,0,1]},
  manzo:{n:'Fettine di manzo magro',u:'g',cat:'Carne e pesce',m:[130,22,0,4.5]},
  macinato:{n:'Macinato di manzo magro',u:'g',cat:'Carne e pesce',m:[130,21,0,5]},
  burgermanzo:{n:'Burger di manzo magro',u:'g',cat:'Carne e pesce',m:[150,20,0,7.5]},
  burgerpollo:{n:'Burger di pollo',u:'g',cat:'Carne e pesce',m:[140,17,4,6]},
  cosce:{n:'Cosce di pollo',u:'g',cat:'Carne e pesce',m:[140,15,0,9]},
  arista:{n:'Arista di maiale',u:'g',cat:'Carne e pesce',m:[150,21,0,7]},
  salmone:{n:'Filetto di salmone',u:'g',cat:'Carne e pesce',m:[200,20,0,13]},
  orata:{n:'Filetti di orata o branzino',u:'g',cat:'Carne e pesce',m:[120,20,0,4.5]},

const LS_KEY='mioPiano.v1';

function migrate(){
  for(const k of ['weights','customPrimi','customContorni','fav','excl','events'])if(!Array.isArray(S[k]))S[k]=[];
  S.set=Object.assign({...DEFAULT_SET},S.set);delete S.set.morning;
  if(!S.set.k150){S.set.kefir=150;S.set.k150=true}if(!S.set.m30){S.set.muesli=30;S.set.m30=true}if(!S.set.s0){S.set.snack=0;S.set.s0=true}
  if(!S.set.p130){if(S.set.prot===150)S.set.prot=130;S.set.p130=true}

  if(S.plan)S.plan.dinners=(S.plan.dinners||[]).filter(d=>RBY[d.rid]);
}

let cloud={ref:null,status:'local',writing:false,again:false,timer:null};
function save(){
  S.updatedAt=Date.now();
  const lim=addDays(todayS(),-90);for(const k of Object.keys(S.days))if(k<lim)delete S.days[k];
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  if(cloud.ref){clearTimeout(cloud.timer);cloud.timer=setTimeout(pushCloud,700)}
}
async function pushCloud(){
  if(!cloud.ref)return;
  if(cloud.writing){cloud.again=true;return}
  cloud.writing=true;
  try{await cloud.ref.set(JSON.parse(JSON.stringify(S)));cloud.status='cloud'}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked')){cloud.ref=null;cloud.status='local'}}
  cloud.writing=false;
  if(cloud.again){cloud.again=false;pushCloud()}
}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/state');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    cloud.ref=ref;cloud.status='cloud';
    if(snap.exists){
      const d=snap.data();
      if(d&&d.v===1&&(d.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(freshState(),JSON.parse(JSON.stringify(d)));migrate();try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
      else if((S.updatedAt||0)>(d&&d.updatedAt||0))pushCloud();
    }else if(S.updatedAt)pushCloud();
    render();
  }catch(e){cloud.status='local'}
}

function allPrimi(){return PRIMI.concat(S.customPrimi.map(c=>[c.id,c.name,...c.m]))}
function allContorni(){return CONTORNI.concat(S.customContorni.map(c=>[c.id,c.name,...c.m]))}
function dayOf(date){return S.days[date]||{}}
function isTraining(date){const d=S.days[date];return !!(d&&d.train)}
function target(date){return isTraining(date)?S.set.train:S.set.rest}
function bfId(date){const b=dayOf(date).bf;return BF[b]?b:S.set.bf}
function bfMacro(id){if(id==='kefirmuesli')return addv(addv([0,0,0,0],KEFIR,S.set.kefir/100),MUESLI,S.set.muesli/100);return BF[id].m.slice()}
function bfDesc(id){return id==='kefirmuesli'?S.set.kefir+' g di kefir, '+S.set.muesli+' g di muesli Conad al cioccolato':BF[id].d}
function snacksOf(date){return (dayOf(date).snacks||[]).map(id=>SNACKS.find(s=>s[0]===id)).filter(Boolean)}
function morningOf(date){const t=bfMacro(bfId(date));for(const s of snacksOf(date))addv(t,s[2]);return t}
function lunchOf(date){
  const d=S.days[date];if(!d||(!d.primo&&!d.secondo))return null;
  const tot=[0,0,0,0];
  const p=allPrimi().find(x=>x[0]===d.primo);if(p)addv(tot,p.slice(2),d.porz||1);
  const sec=SECONDI.find(x=>x[0]===d.secondo);if(sec)addv(tot,sec.slice(2));
  const c=allContorni().find(x=>x[0]===d.contorno);if(c)addv(tot,c.slice(2));
  addv(tot,PANINO,d.pane??1);
  for(const x of d.extra||[]){const e=EXTRA.find(y=>y[0]===x);if(e)addv(tot,e.slice(2))}
  return tot;
}
function sideSpec(r,k){return r.side.alt&&k===r.side.alt.k?r.side.alt:r.side}
/* Cena: si parte dalle dosi della nutrizionista e si confronta il pranzo in mensa con quello previsto dal piano.
   Se hai mangiato di più cala il pane (o le patate), poi l'olio; se hai mangiato meno sale di poco (max +20 g di pane).
   Carne, pesce e uova restano sempre come da piano: la cena non aumenta mai per un pranzo abbondante. */
function dinnerCalc(r,delta,sideK){
  // delta = kcal del pranzo meno quelle del pranzo previsto; null = pranzo non inserito
  const sp=sideSpec(r,sideK);
  const [mk,mq0]=r.ings[0];
  const base=[0,0,0,0];let oil0=0;
  for(const [k,q] of r.ings){if(k==='olio')oil0=q;else addv(base,per(k,q))}
  const sk=per(sp.k,1)[0];
  let side=sp.def,oil=oil0;const notes=[];
  if(delta!=null){
    side=clamp(Math.round((sp.def-delta/sk)/sp.step)*sp.step,0,sp.max);
    let after=delta-(sp.def-side)*sk;
    if(after>80&&oil0>5){oil=5;after-=(oil0-5)*9}
    const nm=ING[sp.k].n.toLowerCase();
    if(side<sp.def)notes.push({t:side===0?'warn':'ok',m:'Pranzo più abbondante del previsto: stasera '+(side?side+' g di '+nm:'niente '+nm)+' invece di '+sp.def+' g'+(oil<oil0?', e un cucchiaino d\'olio invece di un cucchiaio':'')+'.'});
    else if(side>sp.def)notes.push({t:'ok',m:'Pranzo più leggero del previsto: stasera '+side+' g di '+nm+' invece di '+sp.def+' g.'});
    else notes.push({t:'ok',m:'Pranzo in linea con il piano: cena con le dosi della nutrizionista.'});
    if(after>150)notes.push({t:'warn',m:'Pranzo molto più pesante del piano (circa '+r0(after/10)*10+' kcal in più anche togliendo il pane). Cena così, senza aggiunte: domani si riequilibra.'});
    if(after<-150)notes.push({t:'ok',m:'Pranzo leggero: se dopo cena hai ancora fame, aggiungi un frutto.'});
  }
  const tot=addv(addv(base.slice(),per(sp.k,side)),[9*oil,0,0,oil]);
  return {side,sideK:sp.k,sp,oil,oil0,tot,notes,mq:mq0,mq0,main:mk};
}
function planIsCurrent(){return S.plan&&S.plan.ws===mondayOf(todayS())}
function todayDin(){return planIsCurrent()?S.plan.dinners.find(x=>x.day===wdIdx(todayS())):null}
function todayDinner(t){
  const wi=wdIdx(t);if(wi>4||!planIsCurrent())return null;
  const din=S.plan.dinners.find(x=>x.day===wi);if(!din)return null;
  const r=RBY[din.rid];const lunch=lunchOf(t);
  const sk=dayOf(t).sidek;
  const c=dinnerCalc(r,lunch?lunch[0]-PLAN_LUNCH[wi].k:null,sk);
  return {din,r,c,lunch};
}
function generatePlan(){
  const ws=mondayOf(todayS());
  const used=new Set();
  const ok=id=>RBY[id]&&!RBY[id].legacy&&!S.excl.includes(id)&&!used.has(id);
  const dinners=[];
  for(const i of [0,1,2,3,4]){
    let id=(NUTRI_WEEK[i]||[]).slice().sort((a,b)=>S.fav.includes(b)-S.fav.includes(a)).find(ok);
    if(!id){const pool=ACTIVE.filter(r=>ok(r.id)&&(i!==4||r.g==='pesce'));const alt=pool[Math.floor(Math.random()*pool.length)]||ACTIVE.find(r=>ok(r.id));id=alt&&alt.id}
    if(id){used.add(id);dinners.push({day:i,rid:id,done:false})}
  }
  S.plan={ws,dinners,checked:{}};
  save();
}
function shoppingList(){
  const agg={};
  for(const d of S.plan.dinners){const r=RBY[d.rid];
    r.ings.forEach(([k,q],i)=>{agg[k]=(agg[k]||0)+(i===0&&ING[k].u==='g'?q*1.1:q)});
    agg[r.side.k]=(agg[r.side.k]||0)+r.side.def;
  }
  const cats={};
  for(const [k,q] of Object.entries(agg)){const i=ING[k];(cats[i.cat]=cats[i.cat]||[]).push([k,q])}
  return SHOP_ORDER.filter(c=>cats[c]).map(c=>[c,cats[c].sort((a,b)=>ING[a[0]].n.localeCompare(ING[b[0]].n))]);
}
function shopQty(k,q){const i=ING[k];if(i.u==='qb'||k==='olio')return'';if(i.u==='pz')return Math.ceil(q)+(k==='uova'?' uova':' pezzi');
  const g=Math.ceil(q/10)*10;return g>=1000?(String(+(g/1000).toFixed(2)).replace('.',',')+' kg'):g+' g'}
function freshWarn(r,day){return r.shelf<=3&&(day==null||day>=r.shelf)}

function ringSvg(frac,color){

    if(!lunch)h+=`<div class="note warn">Segna il pranzo: le dosi si adattano. Intanto vedi quelle del piano.</div>`;
    for(const n of c.notes)h+=`<div class="note ${n.t==='warn'?'warn':''}">${esc(n.m)}</div>`;
    if(lunch&&r.g==='carne rossa'&&(['ragu','forno'].includes(day.primo)||day.secondo==='carnerossa'))h+=`<div class="note">A pranzo c'era già carne rossa: se ti va, scambia la cena di stasera con un'altra della settimana.</div>`;
    h+=`<div class="btns"><button class="btn" data-a="openRecipe" data-v="${r.id}" data-tonight="1">Ricetta</button><button class="btn" data-a="swapToday">Cambia</button>${din.done?'':`<button class="btn" data-a="eatOut">Mangio fuori</button>`}<button class="btn ${din.done?'':'ok'}" data-a="doneToday" style="margin-left:auto">${din.done?'Annulla':'Fatta'}</button></div>`;
  }
  h+=`</div>`;
  if(planIsCurrent()){
    const frigo=S.plan.dinners.filter(x=>x.day==null&&!x.done);
    if(frigo.length)h+=`<div class="note ${frigo.some(f=>freshWarn(RBY[f.rid],null))?'warn':''}" style="margin:0 4px 12px">In frigo da questa settimana: ${frigo.map(f=>esc(RBY[f.rid].name)).join(', ')}.</div>`;
  }
  return h;
}
function ingList(r,c){
  let h='';
  for(const [k,q] of r.ings){if(ING[k].u==='qb')continue;
    const qq=k==='olio'?c.oil:(k===c.main?c.mq:q);
    h+=`<div class="ing ${qq!==q?'hl'+(qq<q?' down':''):''}"><span>${esc(ING[k].n)}</span><span class="q">${fmtQ(k,qq)}</span></div>`}
  const sp=c.sp;
  h+=`<div class="ing ${c.side!==sp.def?'hl'+(c.side<sp.def?' down':''):''}"><span>${esc(ING[c.sideK].n)}${c.sideK==='pasta'||c.sideK==='riso'?' (crudo)':''}</span><span class="q">${c.side?fmtQ(c.sideK,c.side):'stasera no'}</span></div>`;
  return h;
}

function recipeMatches(r){
  if(recQuery){const q=recQuery.toLowerCase();if(!(r.name.toLowerCase().includes(q)||r.ings.some(([k])=>ING[k].n.toLowerCase().includes(q))))return false}
  if(recFilter==='escluse')return S.excl.includes(r.id);
  if(S.excl.includes(r.id))return false;
  if(recFilter==='tutte')return true;
  if(recFilter==='preferite')return S.fav.includes(r.id);
  return r.g===recFilter;
}
function vRicette(){
  let h=bigTitle('Ricette',ACTIVE.length+' cene della nutrizionista, dosi per una persona');
  h+=`<div class="search">${ico('search','')}<input type="search" id="rq" placeholder="Cerca un piatto o un ingrediente" value="${esc(recQuery)}" autocomplete="off"></div>`;

  const tiles=[['tutte','Tutte','grid'],...Object.entries(GROUPS).filter(([k])=>ACTIVE.some(r=>r.g===k)).map(([k,[n,i]])=>[k,n,i]),['preferite','Preferite','heart']];
  for(const [k,n,i] of tiles){
    const cnt=ACTIVE.filter(r=>!S.excl.includes(r.id)&&(k==='tutte'||(k==='preferite'?S.fav.includes(r.id):r.g===k))).length;
    h+=`<button class="tile t-${gcls(k)} ${recFilter===k?'on':''}" data-a="recFilter" data-v="${k}">${ico(i,'')}<span>${n}<br><small>${cnt} ${cnt===1?'ricetta':'ricette'}</small></span></button>`;

  h+=`</div>`;
  const list=ACTIVE.filter(recipeMatches);

  h+=`<div class="sec"><h2>${title}</h2>${S.excl.length?`<button class="lnk" data-a="recFilter" data-v="${recFilter==='escluse'?'tutte':'escluse'}">${recFilter==='escluse'?'Mostra tutte':'Escluse ('+S.excl.length+')'}</button>`:''}</div>`;
  if(!list.length)h+=`<div class="card"><div class="empty">${recFilter==='preferite'?'Nessuna preferita: apri una ricetta e tocca il cuore.':'Nessuna ricetta trovata.'}</div></div>`;
  const rows=arr=>`<div class="list">${arr.map(r=>{const c=dinnerCalc(r,null);return `<button class="li tap" data-a="openRecipe" data-v="${r.id}"><span class="badge b-${gcls(r.g)}">${ico(GROUPS[r.g][1],'')}</span><span class="main"><div class="tt">${S.fav.includes(r.id)?'♥ ':''}${esc(r.name)}</div><div class="st">${r.time} · ${nf(c.tot[0])} kcal · ${r0(c.tot[1])} g proteine</div></span>${CHEV}</button>`}).join('')}</div>`;

function vSpesa(){
  const t=todayS(),ws=mondayOf(t);
  let h=bigTitle('Spesa','Settimana dal '+fmtDate(ws)+' al '+fmtDate(addDays(ws,4)));
  if(!planIsCurrent()){
    return h+`<div class="card"><div class="empty"><b>Nessun piano per questa settimana</b>Creo 5 cene da lunedì a venerdì prese dal piano della nutrizionista, ordinate per freschezza, e la lista della spesa.<div class="btns" style="justify-content:center"><button class="btn pri" data-a="genPlan">Crea cene e lista</button></div></div></div>`;
  }
  h+=`<div class="sec"><h2>Cene</h2><button class="lnk" data-a="regenPlan">Rigenera</button></div><div class="list">`;
  for(let i=0;i<5;i++){
    const date=addDays(ws,i);const idx=S.plan.dinners.findIndex(x=>x.day===i);const din=S.plan.dinners[idx];
    if(din){const r=RBY[din.rid];
      h+=`<button class="li tap ${din.done?'done':''}" data-a="dinSheet" data-v="${idx}"><span class="daytag ${date===t?'today':''}">${WD[i]}<b>${pd(date).getDate()}</b></span><span class="main"><div class="tt">${S.fav.includes(r.id)?'♥ ':''}${esc(r.name)}</div><div class="st">${din.done?'fatta':r.time+(freshWarn(r,i)?' · <span style="color:var(--orange)">da congelare, scongela la sera prima</span>':'')}</div></span>${CHEV}</button>`;
    }else{
      const frigo=S.plan.dinners.some(x=>x.day==null&&!x.done);
      h+=`<button class="li tap" data-a="${frigo?'swapDay':'noop'}" data-v="${i}"><span class="daytag ${date===t?'today':''}">${WD[i]}<b>${pd(date).getDate()}</b></span><span class="main"><div class="tt muted">Nessuna cena</div>${frigo?'<div class="st">Tocca per mettere una cena dal frigo</div>':''}</span></button>`;
    }
  }
  h+=`</div>`;
  const frigo=S.plan.dinners.map((d,i)=>[d,i]).filter(([d])=>d.day==null&&!d.done);
  if(frigo.length){
    h+=`<div class="cat">In frigo, senza giorno</div><div class="list">`+frigo.map(([d,i])=>{const r=RBY[d.rid];return `<button class="li tap" data-a="dinSheet" data-v="${i}"><span class="badge b-${gcls(r.g)}">${ico(GROUPS[r.g][1],'')}</span><span class="main"><div class="tt">${esc(r.name)}</div>${freshWarn(r,null)?'<div class="st" style="color:var(--orange)">Carne o pesce fresco: cucinalo presto o congelalo</div>':''}</span>${CHEV}</button>`}).join('')+`</div>`;
  }
  const list=shoppingList();
  const total=list.reduce((n,[,it])=>n+it.length,0),done=list.reduce((n,[,it])=>n+it.filter(([k])=>S.plan.checked[k]).length,0);
  h+=`<div class="sec"><h2>Lista della spesa</h2><span class="muted">${done} di ${total}</span></div>`;
  for(const [cat,items] of list){
    h+=`<div class="cat">${esc(cat)}</div><div class="list plain">`;
    for(const [k,q] of items){const on=!!S.plan.checked[k];h+=`<button class="li tap ${on?'on':''}" data-a="check" data-v="${k}" role="checkbox" aria-checked="${on}"><span class="check"></span><span class="main"><div class="tt">${esc(ING[k].n)}</div></span><span class="q">${shopQty(k,q)}</span></button>`}
    h+=`</div>`;
  }
  h+=`<div class="small muted" style="margin:8px 4px 0">Carne e pesce hanno un po' di margine. Il pane in più si congela a fette.</div>
  <div class="btns"><button class="btn" data-a="copyShop">Copia lista</button><button class="btn" data-a="resetChecks">Azzera spunte</button></div>`;
  return h;
}

function dayRec(){const t=todayS();return S.days[t]=S.days[t]||{porz:1,contorno:'insalata',pane:1,extra:[]}}
function commit(msg){save();render();if(msg)toast(msg)}
document.addEventListener('click',async ev=>{
  const tb=ev.target.closest('nav.tabs button');if(tb){setTab(tb.dataset.tab);return}
  const ct=ev.target.closest('[data-ctype]');
  if(ct){const f=$('#customForm');f.elements.kind.value=ct.dataset.ctype;document.querySelectorAll('#ctype button').forEach(b=>b.classList.toggle('on',b===ct));
    const base=ct.dataset.ctype==='primo'?PRIMI.filter(p=>!['altro','nessuno'].includes(p[0])):CONTORNI.filter(c=>c[0]!=='nessuno');
    $('#clike').innerHTML=base.map(p=>`<option value="${p[0]}">${esc(p[1])} · ${p[2]} kcal</option>`).join('');return}
  const el=ev.target.closest('[data-a]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
  const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'noop':break;
    case 'close':closeSheet();break;
    case 'submit':handleForm(el.closest('form'));break;
    case 'settings':openSheet(settingsSheet);break;
    case 'bfSheet':openSheet(bfSheet);break;
    case 'lunchSheet':openSheet(lunchSheet);break;
    case 'pickBf':dayRec().bf=v;S.set.bf=v;closeSheet();commit('Colazione aggiornata');break;
    case 'snack':{const d=dayRec();d.snacks=d.snacks||[];d.snacks=d.snacks.includes(v)?d.snacks.filter(x=>x!==v):[...d.snacks,v];commit();break}
    case 'sidek':dayRec().sidek=v;commit();break;
    case 'porz':dayRec().porz=+v;commit();break;
    case 'pane':dayRec().pane=+v;commit();break;
    case 'extra':{const d=dayRec();d.extra=d.extra||[];d.extra=d.extra.includes(v)?d.extra.filter(x=>x!==v):[...d.extra,v];commit();break}
    case 'addCustom':openSheet(customSheet);break;
    case 'delCustom':S.customPrimi=S.customPrimi.filter(c=>c.id!==v);S.customContorni=S.customContorni.filter(c=>c.id!==v);commit();break;
    case 'genPlan':generatePlan();toast('Cene create');setTab('spesa');break;
    case 'regenPlan':generatePlan();commit('Nuove cene');break;
    case 'openRecipe':{const tn=!!el.dataset.tonight;openSheet(()=>recipeSheet(v,tn));break}
    case 'fav':S.fav=S.fav.includes(v)?S.fav.filter(x=>x!==v):[...S.fav,v];S.excl=S.excl.filter(x=>x!==v);commit();break;
    case 'excl':S.excl=S.excl.includes(v)?S.excl.filter(x=>x!==v):[...S.excl,v];S.fav=S.fav.filter(x=>x!==v);commit(S.excl.includes(v)?'Non te la proporrò più':'Di nuovo tra le proposte');break;
    case 'doneToday':{const din=todayDin();if(din){din.done=!din.done;commit(din.done?'Buon appetito':'')}break}
    case 'toggleDone':{const d=S.plan.dinners[+v];d.done=!d.done;closeSheet();commit();break}
    case 'swapToday':openSheet(()=>swapSheet(wdIdx(todayS())));break;
    case 'swapDay':openSheet(()=>swapSheet(+v));break;
    case 'dinSheet':openSheet(()=>dinSheet(+v));break;
    case 'assignFrom':openSheet(()=>assignSheet(+v));break;
    case 'doAssign':{const din=S.plan.dinners[+v],day=+el.dataset.day;const cur=S.plan.dinners.find(x=>x.day===day&&x!==din);
      if(cur)cur.day=cur.done?null:din.day;
      din.day=day;closeSheet();commit('Fatto');break}
    case 'replaceDin':openSheet(()=>pickerSheet(+v));break;
    case 'pickRecipe':{const din=S.plan.dinners[+el.dataset.idx];din.rid=v;din.done=false;closeSheet();commit('Ricetta cambiata, lista aggiornata');break}
    case 'dropDin':S.plan.dinners.splice(+v,1);closeSheet();commit('Cena tolta');break;
    case 'eatOut':openSheet(eatOutSheet);break;
    case 'shiftAll':{const t=wdIdx(todayS());
      const slots=[0,1,2,3,4].filter(i=>i>t);
      const moving=S.plan.dinners.filter(d=>d.day!=null&&d.day>=t&&!d.done).sort((a,b)=>a.day-b.day);
      moving.forEach((d,i)=>{d.day=i<slots.length?slots[i]:null});closeSheet();commit('Cene spostate di un giorno');break}
    case 'toFrigo':{const d=todayDin();if(d)d.day=null;closeSheet();commit('In frigo');break}
    case 'skipToday':{const d=todayDin();if(d)S.plan.dinners.splice(S.plan.dinners.indexOf(d),1);closeSheet();commit();break}
    case 'check':S.plan.checked[v]=!S.plan.checked[v];commit();break;
    case 'resetChecks':S.plan.checked={};commit();break;
    case 'copyShop':{
      const txt='SPESA\n'+shoppingList().map(([c,it])=>c.toUpperCase()+'\n'+it.map(([k,q])=>'- '+ING[k].n+(shopQty(k,q)?' — '+shopQty(k,q):'')).join('\n')).join('\n\n');
      try{await navigator.clipboard.writeText(txt);toast('Lista copiata')}catch(e){openSheet(()=>`<h2>Lista della spesa</h2><div class="muted small" style="margin:0 4px">Tieni premuto per selezionare e copiare.</div><textarea rows="16" style="width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px">${esc(txt)}</textarea>`)}
      break}
    case 'recFilter':recFilter=v;render();break;
    case 'resetSet':S.set={...DEFAULT_SET,k150:true,m30:true,s0:true,p130:true};closeSheet();commit('Valori ripristinati');break;
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.a==='toggleTrain'){const d=dayRec();d.train=el.checked;commit(el.checked?'Giorno di allenamento':'Giorno di riposo');return}
  if(el.tagName!=='SELECT'||!el.dataset.a)return;
  const d=dayRec();
  if(el.dataset.a==='primo')d.primo=el.value||null;
  if(el.dataset.a==='contorno')d.contorno=el.value;
  if(el.dataset.a==='secondo')d.secondo=el.value==='nessuno'?null:el.value;
  commit();
});
document.addEventListener('input',ev=>{if(ev.target.id==='rq'){recQuery=ev.target.value;const pos=ev.target.selectionStart;render();const i=$('#rq');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}}});
document.addEventListener('submit',ev=>{ev.preventDefault();handleForm(ev.target)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.form){ev.preventDefault();handleForm(ev.target.form)}});
window.addEventListener('scroll',()=>{$('#navbar').classList.toggle('on',window.scrollY>50)},{passive:true});
function handleForm(f){
  if(!f)return;const fd=Object.fromEntries(new FormData(f).entries()),fid=f.getAttribute('id');
  if(fid==='setForm'){
    for(const k of ['kefir','muesli']){const n=parseInt(fd[k],10);if(n>=0&&!isNaN(n))S.set[k]=n}
    closeSheet();commit('Salvato');
  }
  if(fid==='customForm'){
    const name=fd.name.trim();if(!name)return;
    const isP=fd.kind==='primo';const base=(isP?PRIMI:CONTORNI).find(x=>x[0]===fd.like);if(!base)return;
    const item={id:'c_'+uid(),name,m:base.slice(2)};
    (isP?S.customPrimi:S.customContorni).push(item);
    const d=dayRec();if(isP)d.primo=item.id;else d.contorno=item.id;
    openSheet(lunchSheet);commit('Aggiunto');
  }
}

render();
initCloud();
}
</script>
</body>
</html>
